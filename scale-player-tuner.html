<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sine Scale Player</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1d1d1b;--mut:#6b6b66;--acc:#2f6fed;--bd:#dcdad3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--fg:#f1f0ec;--mut:#9a9992;--acc:#6b9bff;--bd:#3a3a38;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
h1{font-size:20px;margin:0 0 18px;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
select{width:100%;padding:11px;font-size:16px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:baseline}
.row span:last-child{font-weight:600;font-size:16px;color:var(--fg)}
.btns{display:flex;gap:10px;margin-top:22px}
button{flex:1;padding:14px 0;font-size:16px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
button#play{background:var(--acc);border-color:var(--acc);color:#fff}
.now{text-align:center;margin-top:24px;min-height:70px}
#note{font-size:44px;font-weight:700}
#freq{font-size:14px;color:var(--mut)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bd)}
.dot.on{background:var(--acc)}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:600}
.tbar{position:relative;height:6px;margin:16px 0 4px;background:var(--bd);border-radius:3px}
.tz{position:absolute;left:50%;top:-4px;width:2px;height:14px;background:var(--mut);margin-left:-1px}
.tl{position:absolute;top:-2px;width:1px;height:10px;background:var(--mut)}
#tneedle{position:absolute;top:-5px;left:50%;width:3px;height:16px;margin-left:-1.5px;border-radius:2px;background:var(--acc);opacity:0;transition:left .09s linear,opacity .2s}
.tlab{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
</style>
</head>
<body>
<audio id="out" playsinline></audio>
<div class="card">
  <h1>Sine Scale Player</h1>
  <label for="scale">Scale</label>
  <select id="scale">
    <option value="maj">Major pentatonic</option>
    <option value="min">Minor pentatonic</option>
  </select>
  <label for="pattern">Pattern</label>
  <select id="pattern">
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
    <option value="updown">Up then down</option>
  </select>
  <label for="root"><span class="row"><span>Starting note (E2 to G5)</span><span id="rootv">C4</span></span></label>
  <input type="range" id="root" min="40" max="79" value="60">
  <label for="bpm"><span class="row"><span>Tempo</span><span id="bpmv">80 BPM</span></span></label>
  <input type="range" id="bpm" min="10" max="200" value="80">
  <div class="btns">
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>
  </div>
  <button id="mic" style="margin-top:14px;width:100%">Enable singing tuner</button>
  <div id="tuner" hidden>
    <div class="tbar"><i class="tl" style="left:0"></i><i class="tz"></i><i class="tl" style="right:0"></i><b id="tneedle"></b></div>
    <div class="tlab"><span>−30¢</span><span id="tcents">–</span><span>+30¢</span></div>
  </div>
  <div class="now"><div id="note">–</div><div id="freq">Major pentatonic, root C4</div><div class="dots" id="dots"></div></div>
  <div class="btns">
    <button id="port" aria-pressed="true">Portamento: On</button>
    <button id="voice" aria-pressed="false">Voice: Off</button>
  </div>
</div>

let voiceOn=false, vBufs=null, vGain=null, vSrcs=[], vRR={}, voiceDb=-7;
const voiceLevel=()=>2.5*Math.pow(10,voiceDb/20); // voice level fixed at -7 dB
function ensureVoice(){
  if(!ctx||vBufs) return;
  vBufs={};
  vGain=ctx.createGain(); vGain.gain.value=voiceLevel(); vGain.connect(gain);
  Object.keys(CLIPS).forEach(k=>{
    vBufs[k]=[];
    CLIPS[k].forEach((c,i)=>{
      const bin=atob(c), u8=new Uint8Array(bin.length);
      for(let j=0;j<bin.length;j++) u8[j]=bin.charCodeAt(j);
      ctx.decodeAudioData(u8.buffer,b=>{ if(vBufs) vBufs[k][i]=b; },()=>{});
    });
  });
}
function playClip(name,t){
  const list=vBufs&&vBufs[name]; if(!list||!vGain) return;
  const i=(vRR[name]||0)%list.length; vRR[name]=i+1; // round robin per word
  const b=list[i]||list.find(x=>x); if(!b) return;
  const src=ctx.createBufferSource(); src.buffer=b;
  const cents=(Math.random()*2-1)*15; // random pitch offset, +/-15 cents
  if(src.detune) src.detune.value=cents; else src.playbackRate.value=Math.pow(2,cents/1200);
  src.t=t; src.connect(vGain); src.start(t);
  vSrcs.push(src); src.onended=()=>{ vSrcs=vSrcs.filter(x=>x!==src); };
}
function clearVoice(){ vSrcs.forEach(x=>{ try{x.stop();}catch(e){} }); vSrcs=[]; }
const MAJ_PAIRS=[[2,3],[4,5]]; // D-E and G-A in C major pentatonic
// minor pentatonic positions: 1=1, 2=♭3, 3=4, 4=5, 5=♭7, 6=8
const MIN_PAIRS=[[2,3],[5,6]]; // flat3-4 and flat7-8

function sequence(){
  const s=SCALES[$("scale").value], p=$("pattern").value;
  if(p==="asc") return s.slice();
  if(p==="desc") return s.slice().reverse();
  return s.concat(s.slice(1,-1).reverse()); // no repeated end notes
}
const rootMidi = () => Number($("root").value); // MIDI note: 40 = E2, 60 = C4, 79 = G5
const noteName = m => NAMES[m%12]+(Math.floor(m/12)-1);
const freqOf = st => 440*Math.pow(2,(rootMidi()+st-69)/12);
const noteDur = () => 2*60/Number(bpmEl.value); // two beats
const glideDur = () => 60/Number(bpmEl.value)/2; // half beat

function schedule(){
  if(state==="playing" && ctx.state!=="running") ctx.resume();
  if(nextTime<ctx.currentTime) nextTime=ctx.currentTime+0.02;
  const s=SCALES[$("scale").value], seq=sequence();
  while(nextTime < ctx.currentTime+1.2){
    pos%=seq.length;
    const st=seq[pos], f=freqOf(st), deg=s.indexOf(st)+1;
    const lo=Math.min(prevDeg,deg), hi=Math.max(prevDeg,deg);
    const pairs = !portOn ? [] : ($("scale").value==="maj" ? MAJ_PAIRS : MIN_PAIRS);
    const glide = prevDeg>0 && pairs.some(p=>p[0]===lo&&p[1]===hi);
    if(glide){
      osc.frequency.setValueAtTime(prevF,nextTime);
      osc.frequency.exponentialRampToValueAtTime(f,nextTime+glideDur());
    } else {
      osc.frequency.setValueAtTime(f,nextTime);
    }
    queue.push({t:nextTime,st,f,m:rootMidi()+st,sol:SOLFEGE[$("scale").value][deg-1]});
    if(voiceOn) playClip(SOLFEGE[$("scale").value][deg-1],nextTime);
    prevDeg=deg; prevF=f;
    nextTime+=noteDur();
    pos++;
  }
}

// Restart the pattern on the new starting note, at the next note boundary (tempo grid unchanged)
function restartAtNextNote(immediate){
  if(!ctx||state==="stopped") return;
  const now=ctx.currentTime;
  const nxt=queue.find(q=>q.t>now);
  const b=immediate?now+0.03:(nxt?nxt.t:nextTime);
  osc.frequency.cancelScheduledValues(b);
  queue=queue.filter(q=>q.t<b);
  vSrcs=vSrcs.filter(x=>{ if(x.t>=b){ try{x.stop();}catch(e){} return false; } return true; });
  nextTime=b; pos=0; prevDeg=0; prevF=0;
  schedule();
}

function start(){
  const AC=window.AudioContext||window.webkitAudioContext;
  try{ ctx=new AC({latencyHint:"playback"}); }catch(e){ ctx=new AC(); }
  osc=ctx.createOscillator(); osc.type="sine";
  gain=ctx.createGain(); gain.gain.value=0;
  osc.connect(gain);
  if(!IOS) gain.connect(ctx.destination);
  else try{
    const dest=ctx.createMediaStreamDestination();
    gain.connect(dest);
    $("out").srcObject=dest.stream;
    $("out").play().catch(()=>{});
  }catch(e){ gain.connect(ctx.destination); }
  const t0=ctx.currentTime+(voiceOn?0.3:0.05);
  osc.frequency.setValueAtTime(freqOf(0),t0);
  osc.start();
  attachMic();
  gain.gain.setTargetAtTime(0.35,t0,0.02);
  pos=0; queue=[]; nextTime=t0; prevDeg=0; prevF=0; vBufs=null; vGain=null; vSrcs=[]; if(voiceOn) ensureVoice();
  schedule();
  timer=setInterval(schedule,50);
  raf=setTimeout(ui,50);
}

function ui(){
  if(ctx){
    const now=ctx.currentTime;
    while(queue.length>1 && queue[1].t<=now) queue.shift();
    const cur=queue[0];
    if(cur && cur.t<=now){
      $("note").textContent=NAMES[cur.m%12]+(Math.floor(cur.m/12)-1);
      $("freq").textContent=cur.sol+" · "+cur.f.toFixed(1)+" Hz";
      const beat=Math.floor((now-cur.t)/(noteDur()/2))%2;
      document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on",i===beat));
    }
  }
  tunerTick();
  raf=setTimeout(ui,50);
}

function play(){
  if(state==="playing"){ restartAtNextNote(true); return; } // Play while playing = restart
  if(state==="stopped") start();
  else if(state==="paused"){
    $("out").play().catch(()=>{});
    ctx.resume().then(()=>gain.gain.setTargetAtTime(0.35,ctx.currentTime,0.02));
  }
  state="playing"; setMicActive();
}
function pause(){
  if(state!=="playing") return;
  state="paused"; setMicActive();
  gain.gain.setTargetAtTime(0,ctx.currentTime,0.02);
  setTimeout(()=>{ if(state==="paused") ctx.suspend(); },120);
}
function stop(){
  if(state==="stopped") return;
  state="stopped"; setMicActive(); if(tN) tN.style.opacity=0;
  clearInterval(timer); clearTimeout(raf);
  const c=ctx, o=osc;
  try{ gain.gain.setTargetAtTime(0,c.currentTime,0.02); }catch(e){}
  setTimeout(()=>{ try{o.stop();}catch(e){} c.close(); },120);
  ctx=null; osc=null; queue=[];
  $("out").pause(); $("out").srcObject=null;
  $("note").textContent="–"; $("freq").textContent="Stopped";
  document.querySelectorAll(".dot").forEach(d=>d.classList.remove("on"));
}

$("play").onclick=play; $("pause").onclick=pause; $("stop").onclick=stop;
$("port").onclick=()=>{ portOn=!portOn; $("port").setAttribute("aria-pressed",portOn); $("port").textContent="Portamento: "+(portOn?"On":"Off"); };
bpmEl.oninput=()=>{ $("bpmv").textContent=bpmEl.value+" BPM"; };
function describe(){
  $("rootv").textContent=noteName(rootMidi());
  if(state==="stopped") $("freq").textContent=$("scale").selectedOptions[0].text+", root "+noteName(rootMidi());
}
$("scale").onchange=describe; $("pattern").onchange=describe;
$("root").oninput=()=>{ describe(); restartAtNextNote(); };
$("voice").onclick=()=>{
  voiceOn=!voiceOn; $("voice").setAttribute("aria-pressed",voiceOn); $("voice").textContent="Voice: "+(voiceOn?"On":"Off");
  if(voiceOn) ensureVoice(); else clearVoice();
};
$("dots").innerHTML='<div class="dot"></div><div class="dot"></div>';
document.addEventListener("visibilitychange",()=>{
  if(state==="playing" && ctx && ctx.state!=="running") ctx.resume();
  setMicActive();
});
try{
  navigator.mediaSession.metadata=new MediaMetadata({title:"Sine Scale Player"});
  navigator.mediaSession.setActionHandler("play",play);
  navigator.mediaSession.setActionHandler("pause",pause);
  navigator.mediaSession.setActionHandler("stop",stop);
}catch(e){}
// ---- singing tuner (exact octave, +/-30 cents) ----
let micStream=null, an=null, buf=null, lastVoiced=0, lastTick=0, hist=[];
const tN=$("tneedle"), tC=$("tcents");
async function enableMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $("mic").textContent="Mic API not available here (needs an https page, not an embedded view)"; return; }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
  }catch(e){ micStream=null; $("mic").textContent="Mic unavailable ("+(e.name||"error")+") – tap to retry"; return; }
  $("mic").textContent="Tuner on – tap to turn off"; $("tuner").hidden=false;
  if(ctx) attachMic();
  setMicActive();
}
function disableMic(){
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  micStream=null; an=null; hist=[];
  $("mic").textContent="Enable singing tuner"; $("tuner").hidden=true; tN.style.opacity=0;
}
function attachMic(){
  if(!micStream||!ctx) return;
  const src=ctx.createMediaStreamSource(micStream);
  const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=70; hp.Q.value=0.7;
  const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1400; lp.Q.value=0.7;
  an=ctx.createAnalyser(); an.fftSize=2048; an.smoothingTimeConstant=0;
  const z=ctx.createGain(); z.gain.value=0; // keeps the analyser pulled on WebKit, silent
  src.connect(hp); hp.connect(lp); lp.connect(an); an.connect(z); z.connect(ctx.destination);
  buf=new Float32Array(an.fftSize);
}
function setMicActive(){ // mic only listens while playing and visible
  const on = state==="playing" && !document.hidden;
  if(micStream) micStream.getTracks().forEach(t=>t.enabled=on);
}
function detect(target){
  an.getFloatTimeDomainData(buf);
  const M=1024, sr=ctx.sampleRate;
  let e=0; for(let i=0;i<M;i++) e+=buf[i]*buf[i];
  if(Math.sqrt(e/M)<0.01) return null; // too quiet: skip all further work
  const T=sr/target, lo=Math.max(3,Math.floor(T*0.94)), hi=Math.ceil(T*1.06);
  if(hi+1+M>buf.length) return null;
  const corr=L=>{ let s=0,a=0,b=0; for(let i=0;i<M;i++){const x=buf[i],y=buf[i+L]; s+=x*y;a+=x*x;b+=y*y;} return s/(Math.sqrt(a*b)+1e-9); };
  const cs={}; let bl=lo, bv=-2;
  for(let L=lo-1;L<=hi+1;L++){ cs[L]=corr(L); if(L>=lo&&L<=hi&&cs[L]>bv){bv=cs[L];bl=L;} }
  if(bv<0.8) return null; // not a clear periodic voice at this pitch
  const y0=cs[bl-1],y1=cs[bl],y2=cs[bl+1], d=y0-2*y1+y2;
  const Tp=bl+(d<0?Math.max(-1,Math.min(1,(y0-y2)/(2*d))):0);
  const h=Math.round(Tp/2); let ch=-1;
  for(let L=h-1;L<=h+1;L++) ch=Math.max(ch,corr(L));
  if(ch>0.8*bv) return null; // singing an octave above: reject
  return 1200*Math.log2(T/Tp);
}
function tunerTick(){
  if(!an||state!=="playing"||document.hidden||!ctx) return;
  const nowp=performance.now(); if(nowp-lastTick<40) return; lastTick=nowp;
  const cur=queue[0], now=ctx.currentTime;
  if(!cur||now-cur.t<0.15) return; // let the singer settle after a note change
  const ct=detect(cur.f);
  if(ct===null){
    hist.length=0;
    if(nowp-lastVoiced>300){ tN.style.opacity=0; tC.textContent="–"; }
    return;
  }
  lastVoiced=nowp;
  hist.push(ct); if(hist.length>3) hist.shift();
  const m=hist.slice().sort((a,b)=>a-b)[hist.length>>1];
  const cl=Math.max(-30,Math.min(30,m)), a=Math.abs(m);
  tN.style.left=(50+cl/30*50)+"%"; tN.style.opacity=1;
  tN.style.background=a<=5?"#2fb344":a<=15?"#e0a100":"#e5484d";
  tC.textContent=(m>0?"+":"")+Math.round(m)+"¢";
}
$("mic").onclick=()=>{ micStream?disableMic():enableMic(); };
</script>
</body>
</html>
